<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243244"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc466"/>
      <stop offset="1" stop-color="#d9831c"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#d8d2c6"/>
    </linearGradient>
    <clipPath id="round"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- a faint inner glow at the top -->
  <ellipse cx="128" cy="40" rx="130" ry="70" fill="#4a6a8a" opacity="0.18" clip-path="url(#round)"/>
  <!-- the hexagonal badge -->
  <polygon points="128,34 207,80 207,172 128,218 49,172 49,80" fill="none" stroke="url(#amber)" stroke-width="13" stroke-linejoin="round"/>
  <polygon points="128,58 186,92 186,160 128,194 70,160 70,92" fill="#0b1016" opacity="0.55"/>
  <!-- three claw marks -->
  <g fill="url(#claw)">
    <path d="M62 74 C 95 92, 140 142, 186 196 C 170 190, 110 136, 56 86 Z"/>
    <path d="M86 56 C 122 76, 164 128, 206 176 C 190 172, 136 122, 80 68 Z"/>
    <path d="M44 100 C 76 118, 118 162, 158 212 C 142 206, 92 160, 38 112 Z"/>
  </g>
  <!-- the amber edge of each claw -->
  <g fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M62 74 C 95 92, 140 142, 186 196"/>
    <path d="M86 56 C 122 76, 164 128, 206 176"/>
    <path d="M44 100 C 76 118, 118 162, 158 212"/>
  </g>
</svg>
